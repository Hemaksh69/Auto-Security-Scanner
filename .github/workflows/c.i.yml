name: Security Scanner CI
on: [push, pull_request]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck *.sh

      - name: Run Basic Test
        run: |
          chmod +x ./auto-security-scanner.sh
          ./auto-security-scanner.sh --help
